services:
  bot:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run start"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-ImaWYE0jbyKA6IJJ}
      - LAVALINK_SECURE=false
    depends_on:
      - lavalink

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    environment:
      - _JAVA_OPTIONS=-Xmx512M
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-ImaWYE0jbyKA6IJJ}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_SP_DC=${SPOTIFY_SP_DC:-}
      - DEEZER_MASTER_DECRYPTION_KEY=${DEEZER_MASTER_DECRYPTION_KEY:-}
      - DEEZER_ARL=${DEEZER_ARL:-}
      - SPOTIFY_CUSTOM_TOKEN_ENDPOINT=${SPOTIFY_CUSTOM_TOKEN_ENDPOINT:-http://spotify-tokener:8080/api/token}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
    ports:
      - '2333:2333'
    depends_on:
      - spotify-tokener

  # Mints Spotify anonymous and account tokens for LavaSrc. Spotify's own token
  # endpoint is TOTP-protected, and playlist reads reject client-credentials
  # tokens with 401 "Valid user authentication required", so LavaSrc cannot load
  # any playlist without this. First-party service from the LavaSrc author.
  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    restart: unless-stopped
    # The service drives headless Chrome; Docker's default 64MB /dev/shm makes it
    # hang rather than fail cleanly.
    shm_size: 1gb
    environment:
      - SPOTIFY_TOKENER_ADDR=0.0.0.0:8080
      - SPOTIFY_TOKENER_LOG_LEVEL=INFO
