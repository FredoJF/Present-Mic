plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # The stock client list works with the pinned snapshot build below. It needs no
    # pot / remoteCipher / oauth configuration; if playback breaks again, update the
    # pinned commit before adding any of that.
    clients:
      - WEB
      - MWEB
      - ANDROID
      - ANDROID_VR
      - IOS
      - TVHTML5_SIMPLY
  lavasrc:
    # Spotify is metadata-only. LavaSrc resolves each Spotify item to a
    # playable provider below, preferring YouTube and falling back to Deezer.
    providers:
      - 'ytsearch:"%ISRC%"'
      - 'ytsearch:%QUERY%'
      - 'dzisrc:%ISRC%'
      - 'dzsearch:%QUERY%'
    sources:
      spotify: true
      deezer: true
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      spDc: ${SPOTIFY_SP_DC:}
      # Playlist reads need an anonymous token, not the client-credentials token.
      # Spotify answers GET /v1/playlists/{id}/items with 401 "Valid user
      # authentication required" for app-only tokens, while /v1/tracks/{id} still
      # works — which is why single tracks resolved fine and playlists did not.
      #
      # preferPartnerApi routes playlist and search loads through Spotify's
      # partner (web player) API, which accepts anonymous tokens. LavaSrc still
      # falls back to the v1 API on failure, logging "Partner API failed for
      # playlist {}, falling back to Spotify v1 API".
      preferPartnerApi: true
      # Anonymous tokens cannot be minted from Spotify's default endpoint anymore
      # (it is TOTP-protected), so LavaSrc needs a token service. The default
      # points at the spotify-tokener container in docker-compose.yml.
      customTokenEndpoint: ${SPOTIFY_CUSTOM_TOKEN_ENDPOINT:http://spotify-tokener:8080/api/token}
    deezer:
      arl: ${DEEZER_ARL:}
      masterDecryptionKey: ${DEEZER_MASTER_DECRYPTION_KEY:}

server:
  port: 2333

lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD:youshallnotpass}
    sources:
      youtube: false
      bandcamp: true
      soundcloud: false
      twitch: false
      vimeo: false
      http: true
      local: false
  plugins:
    # Pinned to a snapshot commit build, not a release. Release 1.18.2 could not
    # parse YouTube's current player script and no client could produce a playable
    # URL; this commit (2026-08-19) fixes it. Snapshot artifacts carry no release
    # notes and can be pruned, so move back to a released coordinate once a tagged
    # release newer than this commit ships.
    - dependency: 'dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3'
      snapshot: true
    # Provides the `normalization` filter that LavalinkService.applyDefaultAudioFilters
    # looks for. Without this plugin that code silently skips itself.
    - dependency: 'com.github.Devoxin:LavaDSPX-Plugin:0.0.5'
      repository: 'https://jitpack.io'
    # 4.8.3 or newer is required for Spotify playlists. Spotify retired
    # GET /v1/playlists/{id}/tracks for apps registered after the change, and
    # 4.8.1 still calls it, so playlist loads fail with "Something went wrong
    # while looking up the track" while individual /v1/tracks/{id} lookups
    # keep working.
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      repository: 'https://maven.lavalink.dev/releases'
      snapshot: false

logging:
  level:
    root: INFO
